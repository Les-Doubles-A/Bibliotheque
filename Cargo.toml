[package]
name = "bibliotheque"
version = "2.0.0"
edition = "2024"
description = "Application Windows locale ultra-rapide qui répertorie les exécutables et raccourcis d'applications du PC"
build = "build.rs"

[[bin]]
name = "Bibliotheque"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
] }
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }
crossbeam-channel = "0.5.17"
crossbeam-deque = "0.8.8"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
memchr = "2.8.3"
parking_lot = "0.12.5"
rfd = "0.17.2"
rustc-hash = "2.1.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
